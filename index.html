<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fc6ff">
<title>Cube Pop</title>
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="btn-settings" class="tb-btn" aria-label="Settings">⚙️</button>
    <button id="btn-sound" class="tb-btn" aria-label="Sound">🔊</button>
    <div id="title"></div>
    <div id="level-label">LEVEL 1</div>
  </div>
  <div id="counter"><span class="arrow">⬆</span><span id="count">0</span></div>
  <div id="shape-name"></div>
  <div id="stage"><canvas id="gl"></canvas></div>
  <div id="toast"></div>
  <div id="powerbar">
    <button id="btn-hint" class="pw" aria-label="Hint"><span class="ico">💡</span><span class="cool"></span><span class="lbl">Hint</span></button>
  </div>
  <canvas id="confetti"></canvas>
  <div id="modal" class="hidden"><div class="card"><h2 id="m-title"></h2><div id="m-body"></div><div id="m-buttons"></div></div></div>
  <div id="loading">Loading…</div>
</div>
<script src="config.js?v=2"></script>
<script src="game.js?v=2"></script>
<script src="audio.js?v=2"></script>
<script type="module" src="main.js?v=2"></script>
</body>
</html>
